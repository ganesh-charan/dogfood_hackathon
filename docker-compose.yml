version: '3.8'

services:
  platform:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
    volumes:
      - db_data:/app/prisma
    restart: unless-stopped

volumes:
  db_data:
